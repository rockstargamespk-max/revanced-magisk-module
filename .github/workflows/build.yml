name: Build Modules
on:
  workflow_call:
    inputs:
      from_ci:
        type: boolean
        required: false
        default: true

  workflow_dispatch:

jobs:
  run:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Locate and diagnose module ZIP
        shell: bash
        run: |
          set -eu

          echo "===== ZIP FILES ====="
          find . -type f -name '*.zip' \
            -not -path './.git/*' \
            -not -path './.gradle/*' \
            -printf '%p (%s bytes)\n' | sort

          echo "===== MODULE CANDIDATES ====="
          find . -type f -name '*.zip' \
            -not -path './.git/*' \
            -not -path './.gradle/*' |
          while IFS= read -r z; do
            entries="$(unzip -Z1 "$z" 2>/dev/null || true)"
            if printf '%s\n' "$entries" | grep -Eq '(^|/)module\.prop$'; then
              echo "===== $z ====="
              echo "--- config ---"
              unzip -p "$z" config 2>/dev/null || true
              echo "--- module.prop ---"
              printf '%s\n' "$entries" | grep -E '(^|/)module\.prop$' |
              while IFS= read -r p; do
                echo "Path: $p"
                unzip -p "$z" "$p" 2>/dev/null || true
              done
              echo "--- APK paths ---"
              printf '%s\n' "$entries" |
                grep -E '(^|/)(base\.apk|stock\.apk|.*youtube.*\.apk)$' || true
            fi
          done

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Update config
        if: ${{ inputs.from_ci }}
        run: |
          if git checkout origin/update build.md; then
            UPDATE_CFG=$(./build.sh config.toml --config-update)
            if [ "$UPDATE_CFG" ]; then
              echo "$UPDATE_CFG" > config.json
            fi
          fi

      - name: Get next version code
        id: next_ver_code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list -L 1 | awk -F '\t' '{print $3}')
          if [ -z "$TAG" ]; then TAG=0; fi
          echo "NEXT_VER_CODE=$((TAG + 1))" >> $GITHUB_OUTPUT

      - name: Verify YouTube APK versions
        shell: bash
        run: |
          set -eu

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          TOOL=""

          # Search installed Android SDK build-tools
          if [ -n "$SDK" ] && [ -d "$SDK/build-tools" ]; then
            for candidate in "$SDK"/build-tools/*/aapt "$SDK"/build-tools/*/aapt2; do
              if [ -x "$candidate" ]; then
                TOOL="$candidate"
              fi
            done
          fi

          # Try apkanalyzer if aapt/aapt2 is unavailable
          ANALYZER=""
          if [ -n "$SDK" ] && [ -x "$SDK/cmdline-tools/latest/bin/apkanalyzer" ]; then
            ANALYZER="$SDK/cmdline-tools/latest/bin/apkanalyzer"
          elif command -v apkanalyzer >/dev/null 2>&1; then
            ANALYZER="$(command -v apkanalyzer)"
          fi

          inspect_apk() {
            apk="$1"
            echo "===== $apk ====="
            if [ -n "$TOOL" ]; then
              "$TOOL" dump badging "$apk" | grep -m1 "^package:"
            elif [ -n "$ANALYZER" ]; then
              "$ANALYZER" manifest application-id "$apk"
              "$ANALYZER" manifest version-name "$apk"
              "$ANALYZER" manifest version-code "$apk"
            else
              echo "No aapt, aapt2, or apkanalyzer found in the installed SDK."
              echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
              echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
              return 2
            fi
          }

          inspect_apk "build/youtube-revanced-v21.40.161-all.apk"

          unzip -p \
            build/youtube-revanced-module-v21.40.161-all.zip \
            stock/base.apk > /tmp/youtube-stock.apk

          inspect_apk /tmp/youtube-stock.apk

          echo "===== MODULE CONFIG ====="
          unzip -p build/youtube-revanced-module-v21.40.161-all.zip config

      - name: Build modules/APKs
        run: if [ -f "config.json" ]; then ./build.sh config.json; else ./build.sh config.toml; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: $GITHUB_REPOSITORY
          NEXT_VER_CODE: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}

      - name: Check final module metadata
        shell: bash
        run: |
          set -eu
          z="build/youtube-revanced-module-v21.40.161-all.zip"

          test -f "$z" || {
            echo "Module ZIP not found: $z"
            exit 1
          }

          echo "===== MODULE CONFIG ====="
          unzip -p "$z" config

          echo "===== MODULE PROPERTIES ====="
          unzip -p "$z" module.prop

          echo "===== INCLUDED APK FILES ====="
          unzip -Z1 "$z" |
            grep -E '(^|/)(base\.apk|stock/base\.apk)$' || true

          echo "===== INSTALLED VERSION REFERENCES ====="
          grep -nE 'PKG_VER|Version mismatch|versionName' \
            module/utils.sh module/customize.sh

      - name: Locate build outputs
        shell: bash
        run: |
          echo "===== CURRENT DIRECTORY ====="
          pwd
          echo "===== ROOT CONTENTS ====="
          ls -lah
          echo "===== BUILD SCRIPT OUTPUT REFERENCES ====="
          grep -nEi 'zip|output|module|artifact|dist|package' build.sh
          echo "===== RECENT OUTPUT FILES ====="
          find . -maxdepth 5 -type f \
            \( -name '*.zip' -o -name '*.apk' -o -name 'module.prop' -o -name 'config' \) \
            -not -path './.git/*' -printf '%p (%s bytes)\n' | head -10
            0

      - name: Get output
        id: get_output
        run: |
          DELIM="$(openssl rand -hex 8)"
          echo "BUILD_LOG<<${DELIM}" >> "$GITHUB_OUTPUT"
          cat build.md >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"
          cp -f build.md build.tmp
      
      - name: Upload release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
          BODY: ${{ steps.get_output.outputs.BUILD_LOG }}
        run: |
          ls -lh ./build/*
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Release" --notes "$BODY"
            gh release upload "$TAG" ./build/* --clobber
          else
            gh release create "$TAG" ./build/* --title "Release" --notes "$BODY"
          fi

      - name: Update modules changelog and update json
        id: update_config
        run: |
          git checkout -f update || git switch --discard-changes --orphan update
          cp -f build.tmp build.md
          get_update_json() {
            echo "{
            \"version\": \"$1\",
            \"versionCode\": ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }},
            \"zipUrl\": \"$2\",
            \"changelog\": \"https://raw.githubusercontent.com/$GITHUB_REPOSITORY/update/build.md\"
          }"
          }

          cd build || { echo "build folder not found"; exit 1; }
          for OUTPUT in *module*.zip; do
            [ "$OUTPUT" = "*module*.zip" ] && continue
            ZIP_S=$(unzip -p "$OUTPUT" module.prop)
            if ! UPDATE_JSON=$(echo "$ZIP_S" | grep updateJson); then continue; fi
            UPDATE_JSON="${UPDATE_JSON##*/}"
            VER=$(echo "$ZIP_S" | grep version=)
            VER="${VER##*=}"
            DLURL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}/${OUTPUT}"
            get_update_json "$VER" "$DLURL" >"../$UPDATE_JSON"
          done
          cd ..

          find . -name "*-update.json" | grep . || : >dummy-update.json

      - name: Commit module json changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
          git add build.md *-update.json
      
          if ! git diff --cached --quiet; then
            git commit -m "Bump version ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}"
            git push origin HEAD:update
          else
            echo "no changes!"
          fi

      - name: Report to Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        if: env.TG_TOKEN != null
        run: |
          cd build || { echo "build folder not found"; exit 1; }

          TG_CHAT="@rvc_magisk"
          NL=$'\n'
          APKS=""
          MODULES=""
          for OUTPUT in *; do
            DL_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}/${OUTPUT}"
            if [[ $OUTPUT = *.apk ]]; then
              APKS+="${NL}📦[${OUTPUT}](${DL_URL})"
            elif [[ $OUTPUT = *.zip ]]; then
              MODULES+="${NL}📦[${OUTPUT}](${DL_URL})"
            fi
          done
          if [ -n "$MODULES" ]; then
            MODULES="Modules:${NL}${MODULES#"$NL"}"
            if [ -n "$APKS" ]; then MODULES+=${NL}${NL}; fi
          fi
          if [ -n "$APKS" ]; then APKS="APKs:${NL}${APKS#"$NL"}"; fi

          BODY="$(cat ../build.md)"
          MSG="*New build!*

          ${BODY}

          *▼ Download Links:*
          ${MODULES}${APKS}
          "
          echo "'$MSG'"
          MSG=${MSG:0:9450}
          POST="https://api.telegram.org/bot${TG_TOKEN}/sendMessage"
          curl -X POST --data-urlencode "parse_mode=Markdown" --data-urlencode "disable_web_page_preview=true" --data-urlencode "text=${MSG}" --data-urlencode "chat_id=${TG_CHAT}" "$POST"
