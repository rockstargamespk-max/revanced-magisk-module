enable-module-update = true
parallel-jobs = 1

# Build only the requested YouTube module, targeting the exact requested APK.
[YouTube-ReVanced]
app-name = "YouTube"
patches-source = "lavinhoque33/revanced-patches"
patches-version = "dev"
cli-source = "MorpheApp/morphe-cli"
cli-version = "latest"
rv-brand = "ReVanced Extended"
build-mode = "both"
version = "21.42.241"
arch = "arm64-v8a"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
apkpure-dlurl = "https://apkpure.net/youtube-app/com.google.android.youtube"
enable-update-checks = true

# Exclude patches that are not wanted for this build.
excluded-patches = """\
  'Alternative thumbnails' \
  'AI channel filter' \
  'Change form factor' \
  'Shorts components' \
  'Gemini' \
  'Hide feed components' \
  'Navigation bar components' \
  'Open channel of live avatar' \
  'SponsorBlock' \
  """

# Keep the expected explicit disable argument for GmsCore support.
patcher-args = " -d 'GmsCore support' "
