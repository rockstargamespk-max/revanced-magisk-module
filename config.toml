enable-module-update = true
parallel-jobs = 1

# Build only YouTube with the requested Morphe experimental patches.
[YouTube-Morphe]
app-name = "YouTube"
patches-source = "MorpheApp/morphe-patches"
patches-version = "v1.48.0-dev.15"
cli-source = "MorpheApp/morphe-cli"
cli-version = "latest"
rv-brand = "Morphe"
build-mode = "both"
arch = "arm64-v8a"
version = "auto"
apkpure-dlurl = "https://apkpure.com/youtube/com.google.android.youtube"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
apkarchive-dlurl = "https://apkarchive.org/apk/google-inc/youtube/"
enable-update-checks = true
